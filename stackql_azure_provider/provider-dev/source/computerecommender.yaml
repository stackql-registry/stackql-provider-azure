          type: array
          items:
            $ref: '#/components/schemas/Operation'
        nextLink:
          type: string
    SystemData:
      type: object
      description: Metadata pertaining to creation and last modification of the resource.
      properties:
        createdBy:
          type: string
          description: The identity that created the resource.
        createdByType:
          $ref: '#/components/schemas/CreatedByType'
          description: 'The type of identity that created the resource. Known values are: "User", "Application",
            "ManagedIdentity", and "Key".'
        createdAt:
          type: string
          format: date-time
          description: The timestamp of resource creation (UTC).
        lastModifiedBy:
          type: string
          description: The identity that last modified the resource.
        lastModifiedByType:
          $ref: '#/components/schemas/CreatedByType'
          description: 'The type of identity that last modified the resource. Known values are: "User", "Application",
            "ManagedIdentity", and "Key".'
        lastModifiedAt:
          type: string
          format: date-time
          description: The timestamp of resource last modification (UTC).
    CreatedByType:
      type: string
      enum:
      - User
      - Application
      - ManagedIdentity
      - Key
    DiagnosticProperties:
      type: object
      description: Contains additional properties of a diagnostic.
      properties:
        supportedResourceTypes:
          type: array
          items:
            type: string
          description: Describes what are the supported resource types for a diagnostic.
    ComputeDiagnosticBaseFlattened:
      type: object
      description: Flattened view of ComputeDiagnosticBase ('properties' hoisted to the top level).
      properties:
        id:
          type: string
          description: Fully qualified resource ID for the resource. Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}.
        name:
          type: string
          description: The name of the resource.
        type:
          type: string
          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines" or "Microsoft.Storage/storageAccounts".
        systemData:
          $ref: '#/components/schemas/SystemData'
          description: Azure Resource Manager metadata containing createdBy and modifiedBy information.
        supportedResourceTypes:
          type: array
          items:
            type: string
          description: Describes what are the supported resource types for a diagnostic.
    ResourceSize:
      type: object
      description: SpotPlacementRecommender API response.
      properties:
        sku:
          type: string
          description: The resource's CRP virtual machine SKU size.
    SpotPlacementScoresResponse:
      type: object
      description: SpotPlacementScores API response.
      properties:
        desiredLocations:
          type: array
          items:
            type: string
          description: The desired regions.
        desiredSizes:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSize'
          description: The desired virtual machine SKU sizes.
        desiredCount:
          type: integer
          description: Desired instance count per region/zone based on the scope.
        availabilityZones:
          type: boolean
          description: Defines if the scope is zonal or regional.
        placementScores:
          type: array
          items:
            $ref: '#/components/schemas/PlacementScore'
          description: A placement score indicating the likelihood of successfully allocating the specified Spot
            VM(s), as well as the expected lifetimes of the Spot VM(s) after allocation.
    PlacementScore:
      type: object
      description: The spot placement score for sku/region/zone combination.
      properties:
        sku:
          type: string
          description: The resource's CRP virtual machine SKU size.
        region:
          type: string
          description: The region.
        availabilityZone:
          type: string
          description: The availability zone.
        score:
          type: string
          description: A placement score indicating the likelihood of successfully allocating the specified Spot
            VM(s), as well as the expected lifetimes of the Spot VM(s) after allocation.
        isQuotaAvailable:
          type: boolean
          description: Whether the desired quota is available.
