        in: path
        required: true
        schema:
          type: string
        description: The event ID this activation applies to. Required.
      responses:
        '200':
          description: Success
      x-stackql-resource: activate_multi_slot_events
      x-stackql-method: activate_multi_slot_event
      x-stackql-verb: EXEC
  /multislot/rank?api-version=2022-09-01-preview:
    post:
      operationId: PersonalizerClient_rank_multi_slot
      description: Rank (MultiSlot). Submit a Personalizer multi-slot rank request. Receives a context, a list of
        actions, and a list of slots. Returns which of the provided actions should be used in each slot, in each
        rewardActionId.
      parameters: []
      responses:
        '200':
          description: Success
      x-stackql-resource: rank_multi_slots
      x-stackql-method: rank_multi_slot
      x-stackql-verb: EXEC
  /rank?api-version=2022-09-01-preview:
    post:
      operationId: PersonalizerClient_rank_single_slot
      description: Rank. Submit a Personalizer rank request. Receives a context and a list of actions. Returns which
        of the provided actions should be used by your application, in rewardActionId.
      parameters: []
      responses:
        '200':
          description: Success
      x-stackql-resource: rank_single_slots
      x-stackql-method: rank_single_slot
      x-stackql-verb: EXEC
