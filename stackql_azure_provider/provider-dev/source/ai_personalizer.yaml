      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event ID to be activated. Required.
      responses:
        '200':
          description: Success
      x-stackql-resource: activate_single_slot_events
      x-stackql-method: activate_single_slot_event
      x-stackql-verb: EXEC
  /configurations/applyFromEvaluation?api-version=2022-09-01-preview:
