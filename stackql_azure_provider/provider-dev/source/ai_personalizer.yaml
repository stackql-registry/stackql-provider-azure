        '200':
          description: Success
      x-stackql-resource: reward_multi_slot_events
      x-stackql-method: reward_multi_slot_event
      x-stackql-verb: EXEC
  /multislot/events/{event_id}/activate?api-version=2022-09-01-preview:
    post:
      operationId: PersonalizerClient_activate_multi_slot_event
      description: Activate Event (MultiSlot). Report that the specified event was actually used or displayed to
        the user and a rewards should be expected for it.
      parameters:
