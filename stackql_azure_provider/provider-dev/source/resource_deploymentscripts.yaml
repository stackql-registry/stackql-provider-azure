      type: object
      description: 'Deployment script object. You probably want to use the sub-classes and not this class directly.
        Known sub-classes are: AzureCliScript, AzurePowerShellScript Variables are only populated by the server,
        and will be ignored when sending a request. All required parameters must be populated in order to send to
        server.'
      properties:
        id:
          type: string
          description: String Id used to locate any resource on Azure.
        name:
          type: string
          description: Name of this resource.
        type:
          type: string
          description: Type of this resource.
        identity:
          $ref: '#/components/schemas/ManagedServiceIdentity'
          description: Optional property. Managed identity to be used for this deployment script. Currently, only
            user-assigned MSI is supported.
        location:
          type: string
          description: The location of the ACI and the storage account for the deployment script. Required.
        tags:
          type: object
          properties: {}
          description: Resource tags.
        kind:
          type: string
          description: 'Type of the script. Required. Known values are: "AzurePowerShell" and "AzureCLI".'
        systemData:
          $ref: '#/components/schemas/SystemData'
          description: The system metadata related to this resource.
      required:
      - location
      - kind
