openapi: 3.0.0
servers:
- url: https://{vault_base_url}
  variables:
    vault_base_url:
      default: ''
      description: The service endpoint host (no scheme), e.g. myaccount.table.cosmos.azure.com:443 - value of the
        client `vaultBaseUrl` parameter.
info:
  title: Key Vault Access Control Client
  description: Manages role-based access to Azure Key Vault.
  contact:
    name: StackQL Studios
    url: https://stackql.io/
    email: info@stackql.io
  version: 2026-01-01-preview-stackql-generated
  x-serviceAlias: keyvault_administration
  x-sdkPackage: azure-keyvault-administration
  x-plane: data
security:
- azure_auth:
  - user_impersonation
components:
  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    RoleAssignmentPropertiesWithScope:
      type: object
      description: Role assignment properties with scope.
      properties:
        scope:
          $ref: '#/components/schemas/RoleScope'
          description: 'The role scope. Known values are: "/" and "/keys".'
        roleDefinitionId:
          type: string
          description: The role definition ID.
        principalId:
          type: string
          description: The principal ID.
    RoleScope:
      type: string
      enum:
      - /
      - /keys
    RoleAssignmentFlattened:
      type: object
      description: Flattened view of RoleAssignment ('properties' hoisted to the top level).
      properties:
        id:
          type: string
          description: The role assignment ID.
        name:
          type: string
          description: The role assignment name.
        type:
          type: string
          description: The role assignment type.
        scope:
          $ref: '#/components/schemas/RoleScope'
          description: 'The role scope. Known values are: "/" and "/keys".'
        roleDefinitionId:
          type: string
          description: The role definition ID.
        principalId:
          type: string
          description: The principal ID.
    PagedRoleAssignmentFlattened:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentFlattened'
        nextLink:
          type: string
    RoleAssignment:
      type: object
      description: Role Assignments.
      properties:
        id:
          type: string
          description: The role assignment ID.
        name:
          type: string
          description: The role assignment name.
        type:
          type: string
          description: The role assignment type.
        properties:
          $ref: '#/components/schemas/RoleAssignmentPropertiesWithScope'
          description: Role assignment properties.
    RoleAssignmentProperties:
      type: object
      description: Role assignment properties.
      properties:
        roleDefinitionId:
          type: string
          description: The role definition ID used in the role assignment. Required.
        principalId:
          type: string
          description: The principal ID assigned to the role. This maps to the ID inside the Active Directory. It
            can point to a user, service principal, or security group. Required.
      required:
      - roleDefinitionId
      - principalId
    RoleDefinitionType:
      type: string
      enum:
      - Microsoft.Authorization/roleDefinitions
    RoleDefinitionProperties:
      type: object
      description: Role definition properties.
      properties:
        roleName:
          type: string
          description: The role name.
        description:
          type: string
          description: The role definition description.
        type:
          $ref: '#/components/schemas/RoleType'
          description: 'The role type. Known values are: "AKVBuiltInRole" and "CustomRole".'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Role definition permissions.
        assignableScopes:
          type: array
          items:
            $ref: '#/components/schemas/RoleScope'
          description: Role definition assignable scopes.
    RoleType:
      type: string
      enum:
      - AKVBuiltInRole
      - CustomRole
    Permission:
      type: object
      description: Role definition permissions.
      properties:
        actions:
          type: array
          items:
            type: string
          description: Action permissions that are granted.
        notActions:
          type: array
          items:
            type: string
          description: Action permissions that are excluded but not denied. They may be granted by other role definitions
            assigned to a principal.
        dataActions:
          type: array
          items:
            $ref: '#/components/schemas/DataAction'
          description: Data action permissions that are granted.
        notDataActions:
          type: array
          items:
            $ref: '#/components/schemas/DataAction'
          description: Data action permissions that are excluded but not denied. They may be granted by other role
            definitions assigned to a principal.
    DataAction:
      type: string
      enum:
      - Microsoft.KeyVault/managedHsm/keys/read/action
      - Microsoft.KeyVault/managedHsm/keys/write/action
      - Microsoft.KeyVault/managedHsm/keys/deletedKeys/read/action
      - Microsoft.KeyVault/managedHsm/keys/deletedKeys/recover/action
      - Microsoft.KeyVault/managedHsm/keys/backup/action
      - Microsoft.KeyVault/managedHsm/keys/restore/action
      - Microsoft.KeyVault/managedHsm/roleAssignments/delete/action
      - Microsoft.KeyVault/managedHsm/roleAssignments/read/action
      - Microsoft.KeyVault/managedHsm/roleAssignments/write/action
      - Microsoft.KeyVault/managedHsm/roleDefinitions/read/action
      - Microsoft.KeyVault/managedHsm/roleDefinitions/write/action
      - Microsoft.KeyVault/managedHsm/roleDefinitions/delete/action
      - Microsoft.KeyVault/managedHsm/keys/encrypt/action
      - Microsoft.KeyVault/managedHsm/keys/decrypt/action
      - Microsoft.KeyVault/managedHsm/keys/wrap/action
      - Microsoft.KeyVault/managedHsm/keys/unwrap/action
      - Microsoft.KeyVault/managedHsm/keys/sign/action
      - Microsoft.KeyVault/managedHsm/keys/verify/action
      - Microsoft.KeyVault/managedHsm/keys/create
      - Microsoft.KeyVault/managedHsm/keys/delete
      - Microsoft.KeyVault/managedHsm/keys/export/action
      - Microsoft.KeyVault/managedHsm/keys/release/action
      - Microsoft.KeyVault/managedHsm/keys/import/action
      - Microsoft.KeyVault/managedHsm/keys/deletedKeys/delete
      - Microsoft.KeyVault/managedHsm/securitydomain/download/action
      - Microsoft.KeyVault/managedHsm/securitydomain/download/read
      - Microsoft.KeyVault/managedHsm/securitydomain/upload/action
      - Microsoft.KeyVault/managedHsm/securitydomain/upload/read
      - Microsoft.KeyVault/managedHsm/securitydomain/transferkey/read
      - Microsoft.KeyVault/managedHsm/backup/start/action
      - Microsoft.KeyVault/managedHsm/restore/start/action
      - Microsoft.KeyVault/managedHsm/backup/status/action
      - Microsoft.KeyVault/managedHsm/restore/status/action
      - Microsoft.KeyVault/managedHsm/rng/action
    RoleDefinitionFlattened:
      type: object
      description: Flattened view of RoleDefinition ('properties' hoisted to the top level).
      properties:
        id:
          type: string
          description: The role definition ID.
        name:
          type: string
          description: The role definition name.
        type:
          $ref: '#/components/schemas/RoleDefinitionType'
          description: The role definition type. "Microsoft.Authorization/roleDefinitions"
        roleName:
          type: string
          description: The role name.
        description:
          type: string
          description: The role definition description.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Role definition permissions.
        assignableScopes:
          type: array
          items:
            $ref: '#/components/schemas/RoleScope'
          description: Role definition assignable scopes.
    PagedRoleDefinitionFlattened:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinitionFlattened'
        nextLink:
          type: string
    RoleDefinition:
      type: object
      description: Role definition.
      properties:
        id:
          type: string
          description: The role definition ID.
        name:
          type: string
          description: The role definition name.
        type:
          $ref: '#/components/schemas/RoleDefinitionType'
          description: The role definition type. "Microsoft.Authorization/roleDefinitions"
        properties:
          $ref: '#/components/schemas/RoleDefinitionProperties'
          description: Role definition properties.
    SettingTypeEnum:
      type: string
      enum:
      - boolean
    Setting:
      type: object
      description: A Key Vault account setting.
      properties:
        name:
          type: string
          description: The account setting to be updated. Required.
        value:
          type: string
          description: The value of the pool setting. Required.
        type:
          $ref: '#/components/schemas/SettingTypeEnum'
          description: The type specifier of the value. "boolean"
      required:
      - name
      - value
    SettingsListResult:
      type: object
      description: The settings list result.
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
          description: A response message containing a list of account settings with their associated value.
    EkmConnection:
      type: object
      description: A EkmConnection model object.
      properties:
        host:
          type: string
          description: EKM proxy FQDN (Fully Qualified Domain Name). Only allowed characters are a-z, A-Z, 0-9,
            hyphen (-), dot (.), and colon (:). Required.
        path_prefix:
          type: string
          description: Optional path prefix for the EKM proxy (if any).
        server_ca_certificates:
          type: array
          items:
            type: string
            format: byte
          description: The root CA certificate chain that issued the proxy server's certificate. An array of certificates
            in the certificate chain, each in DER format and base64 encoded. Required.
        server_subject_common_name:
          type: string
          description: The subject common name of the server certificate of EKM Proxy.
      required:
      - host
      - server_ca_certificates
    EkmProxyClientCertificateInfo:
      type: object
      description: EKM proxy client certificate information.
      properties:
        ca_certificates:
          type: array
          items:
            type: string
            format: byte
          description: The client root CA certificate chain to authenticate to the EKM proxy. An array of certificates
            in the certificate chain, each in DER format and base64 encoded. Required.
        subject_common_name:
          type: string
          description: The subject common name of the client certificate used to authenticate to the EKM proxy.
            Required.
    FullBackupOperation:
      type: object
      description: Full backup operation.
      properties:
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'Status of the backup operation. Known values are: "InProgress", "Succeeded", "Canceled",
            and "Failed".'
        statusDetails:
          type: string
          description: The status details of backup operation.
        error:
          $ref: '#/components/schemas/FullBackupOperationError'
          description: Error encountered, if any, during the full backup operation.
        startTime:
          type: string
          format: date-time
          description: The start time of the backup operation in UTC.
        endTime:
          type: string
          format: date-time
          description: The end time of the backup operation in UTC.
        jobId:
          type: string
          description: Identifier for the full backup operation.
        azureStorageBlobContainerUri:
          type: string
          description: The Azure blob storage container Uri which contains the full backup.
    OperationStatus:
      type: string
      enum:
      - InProgress
      - Succeeded
      - Canceled
      - Failed
    FullBackupOperationError:
      type: object
      description: FullBackupOperationError.
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
        innererror:
          $ref: '#/components/schemas/FullBackupOperationError'
          description: The key vault server error.
    RestoreOperation:
      type: object
      description: Restore operation.
      properties:
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'Status of the restore operation. Known values are: "InProgress", "Succeeded", "Canceled",
            and "Failed".'
        statusDetails:
          type: string
          description: The status details of restore operation.
        error:
          $ref: '#/components/schemas/FullBackupOperationError'
          description: Error encountered, if any, during the restore operation.
        jobId:
          type: string
          description: Identifier for the restore operation.
        startTime:
          type: string
          format: date-time
          description: The start time of the restore operation.
        endTime:
          type: string
          format: date-time
          description: The end time of the restore operation.
    SASTokenParameter:
      type: object
      description: An authentication method and location for the operation.
      properties:
        storageResourceUri:
          type: string
          description: Azure Blob storage container Uri. Required.
        token:
          type: string
          description: The SAS token pointing to an Azure Blob storage container.
        useManagedIdentity:
          type: boolean
          description: Indicates which authentication method should be used. If set to true, Managed HSM will use
            the configured user-assigned managed identity to authenticate with Azure Storage. Otherwise, a SAS token
            has to be specified.
      required:
      - storageResourceUri
    SelectiveKeyRestoreOperation:
      type: object
      description: Selective Key Restore operation.
      properties:
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'Status of the restore operation. Known values are: "InProgress", "Succeeded", "Canceled",
            and "Failed".'
        statusDetails:
          type: string
          description: The status details of restore operation.
        error:
          $ref: '#/components/schemas/FullBackupOperationError'
          description: Error encountered, if any, during the selective key restore operation.
        jobId:
          type: string
          description: Identifier for the selective key restore operation.
        startTime:
          type: string
          format: date-time
          description: The start time of the restore operation.
        endTime:
          type: string
          format: date-time
          description: The end time of the restore operation.
    EkmProxyInfo:
      type: object
      description: EKM proxy information.
      properties:
        api_version:
          type: string
          description: The highest version of proxy interface API supported by the EKM Proxy. Required.
        proxy_vendor:
          type: string
          description: The name of the proxy vendor. Required.
        proxy_name:
          type: string
          description: The name of the proxy product and its version. Required.
        ekm_vendor:
          type: string
          description: The name of the EKM vendor. Required.
        ekm_product:
          type: string
          description: The name of the EKM product and its version. Required.
      required:
      - api_version
      - proxy_vendor
      - proxy_name
      - ekm_vendor
      - ekm_product
paths:
  /{scope}/providers/Microsoft.Authorization/roleAssignments/{role_assignment_name}?api-version=2026-01-01-preview:
    get:
      operationId: RoleAssignments_get
      description: Get the specified role assignment.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role assignment. Required.
      - name: role_assignment_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the role assignment to get. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentFlattened'
      x-stackql-resource: role_assignments
      x-stackql-method: get
      x-stackql-verb: SELECT
      x-stackql-flatten: singleton
    delete:
      operationId: RoleAssignments_delete
      description: Deletes a role assignment.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role assignment to delete. Required.
      - name: role_assignment_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the role assignment to delete. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
      x-stackql-resource: role_assignments
      x-stackql-method: delete
      x-stackql-verb: DELETE
    put:
      operationId: RoleAssignments_create
      description: Creates a role assignment.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role assignment to create. Required.
      - name: role_assignment_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the role assignment to create. It can be any valid GUID. Required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  $ref: '#/components/schemas/RoleAssignmentProperties'
                  description: Role assignment properties. Required.
              required:
              - properties
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
      x-stackql-resource: role_assignments
      x-stackql-method: create
      x-stackql-verb: INSERT
  /{scope}/providers/Microsoft.Authorization/roleAssignments?api-version=2026-01-01-preview:
    get:
      operationId: RoleAssignments_list_for_scope
      description: Gets role assignments for a scope.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role assignments. Required.
      - name: $filter
        in: query
        required: false
        schema:
          type: string
        description: The filter to apply on the operation. Use $filter=atScope() to return all role assignments
          at or above the scope. Use $filter=principalId eq {id} to return all role assignments at, above or below
          the scope for the specified principal. Default value is None.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRoleAssignmentFlattened'
      x-stackql-resource: role_assignments
      x-stackql-method: list_for_scope
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.value
      x-stackql-flatten: list
      x-stackql-flattenKey: value
  /{scope}/providers/Microsoft.Authorization/roleDefinitions/{role_definition_name}?api-version=2026-01-01-preview:
    get:
      operationId: RoleDefinitions_get
      description: Get the specified role definition.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role definition to get. Managed HSM only supports '/'. Required.
      - name: role_definition_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the role definition to get. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionFlattened'
      x-stackql-resource: role_definitions
      x-stackql-method: get
      x-stackql-verb: SELECT
      x-stackql-flatten: singleton
    put:
      operationId: RoleDefinitions_create_or_update
      description: Creates or updates a custom role definition.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role definition to create or update. Managed HSM only supports '/'. Required.
      - name: role_definition_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the role definition to create or update. It can be any valid GUID. Required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  $ref: '#/components/schemas/RoleDefinitionProperties'
                  description: Role definition properties. Required.
              required:
              - properties
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinition'
      x-stackql-resource: role_definitions
      x-stackql-method: create_or_update
      x-stackql-verb: INSERT
    delete:
      operationId: RoleDefinitions_delete
      description: Deletes a custom role definition.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role definition to delete. Managed HSM only supports '/'. Required.
      - name: role_definition_name
        in: path
        required: true
        schema:
          type: string
        description: The name (GUID) of the role definition to delete. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinition'
      x-stackql-resource: role_definitions
      x-stackql-method: delete
      x-stackql-verb: DELETE
  /{scope}/providers/Microsoft.Authorization/roleDefinitions?api-version=2026-01-01-preview:
    get:
      operationId: RoleDefinitions_list
      description: Get all role definitions that are applicable at scope and above.
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
        description: The scope of the role definition. Required.
      - name: $filter
        in: query
        required: false
        schema:
          type: string
        description: The filter to apply on the operation. Use atScopeAndBelow filter to search below the given
          scope as well. Default value is None.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRoleDefinitionFlattened'
      x-stackql-resource: role_definitions
      x-stackql-method: list
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.value
      x-stackql-flatten: list
      x-stackql-flattenKey: value
  /settings/{setting_name}?api-version=2026-01-01-preview:
    get:
      operationId: _KeyVaultClient_get_setting
      description: Get specified account setting object. Retrieves the setting object of a specified setting name.
      parameters:
      - name: setting_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the account setting. Must be a valid settings option. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
      x-stackql-resource: settings
      x-stackql-method: get_setting
      x-stackql-verb: SELECT
    patch:
      operationId: _KeyVaultClient_update_setting
      description: Updates key vault account setting, stores it, then returns the setting name and value to the
        client. Description of the pool setting to be updated.
      parameters:
      - name: setting_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the account setting. Must be a valid settings option. Required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: The value of the pool setting. Required.
              required:
              - value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
      x-stackql-resource: settings
      x-stackql-method: update_setting
      x-stackql-verb: UPDATE
  /settings?api-version=2026-01-01-preview:
    get:
      operationId: _KeyVaultClient_get_settings
      description: List account settings. Retrieves a list of all the available account settings that can be configured.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsListResult'
      x-stackql-resource: settings
      x-stackql-method: get_settings
      x-stackql-verb: SELECT
  /ekm?api-version=2026-01-01-preview:
    get:
      operationId: _KeyVaultClient_get_ekm_connection
      description: Gets the EKM connection. The External Key Manager (EKM) Get operation returns EKM connection.
        This operation requires ekm/read permission.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EkmConnection'
      x-stackql-resource: ekm_connections
      x-stackql-method: get_ekm_connection
      x-stackql-verb: SELECT
    patch:
      operationId: _KeyVaultClient_update_ekm_connection
      description: Updates the EKM connection. The External Key Manager (EKM) updates the existing EKM connection.
        If the EKM connection does not exist, this operation fails. This operation requires ekm/write permission.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                  description: EKM proxy FQDN (Fully Qualified Domain Name). Only allowed characters are a-z, A-Z,
                    0-9, hyphen (-), dot (.), and colon (:). Required.
                path_prefix:
                  type: string
                  description: Optional path prefix for the EKM proxy (if any).
                server_ca_certificates:
                  type: array
                  items:
                    type: string
                    format: byte
                  description: The root CA certificate chain that issued the proxy server's certificate. An array
                    of certificates in the certificate chain, each in DER format and base64 encoded. Required.
                server_subject_common_name:
                  type: string
                  description: The subject common name of the server certificate of EKM Proxy.
              required:
              - host
              - server_ca_certificates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EkmConnection'
      x-stackql-resource: ekm_connections
      x-stackql-method: update_ekm_connection
      x-stackql-verb: UPDATE
    delete:
      operationId: _KeyVaultClient_delete_ekm_connection
      description: Deletes the EKM connection. The External Key Manager (EKM) deletes the existing EKM connection.
        If the EKM connection does not already exists, this operation fails. This operation requires ekm/delete
