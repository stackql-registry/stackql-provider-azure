    Operation:
      type: object
      description: Details of a REST API operation, returned from the Resource Provider Operations API. Variables
        are only populated by the server, and will be ignored when sending a request.
      properties:
        name:
          type: string
          description: 'The name of the operation, as per Resource-Based Access Control (RBAC). Examples: "Microsoft.Compute/virtualMachines/write",
            "Microsoft.Compute/virtualMachines/capture/action".'
        isDataAction:
          type: boolean
          description: Whether the operation applies to data-plane. This is "true" for data-plane operations and
            "false" for ARM/control-plane operations.
        display:
          $ref: '#/components/schemas/OperationDisplay'
          description: Localized display information for this particular operation.
        origin:
          type: string
          description: 'The intended executor of the operation; as in Resource Based Access Control (RBAC) and audit
            logs UX. Default value is "user,system". Known values are: "user", "system", and "user,system".'
        actionType:
          type: string
          description: Enum. Indicates the action type. "Internal" refers to actions that are for internal only
