openapi: 3.0.0
servers:
- url: '{vault_base_url}'
  variables:
    vault_base_url:
      default: ''
      description: The service endpoint, e.g. value of the client `vaultBaseUrl` parameter.
info:
  title: Secret Client
  description: A high-level interface for managing a vault's secrets.
  contact:
    name: StackQL Studios
    url: https://stackql.io/
    email: info@stackql.io
  version: 2025-07-01-stackql-generated
  x-serviceAlias: keyvault_secrets
  x-sdkPackage: azure-keyvault-secrets
  x-plane: data
security:
- azure_auth:
  - user_impersonation
components:
  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    SecretAttributes:
      type: object
      description: The secret management attributes.
      properties:
        enabled:
          type: boolean
          description: Determines whether the object is enabled.
        nbf:
          type: string
          format: date-time
          description: Not before date in UTC.
        exp:
          type: string
          format: date-time
          description: Expiry date in UTC.
        created:
          type: string
          format: date-time
          description: Creation time in UTC.
        updated:
          type: string
          format: date-time
          description: Last updated time in UTC.
        recoverableDays:
          type: integer
          description: softDelete data retention days. Value should be >=7 and <=90 when softDelete enabled, otherwise
            0.
        recoveryLevel:
          $ref: '#/components/schemas/DeletionRecoveryLevel'
          description: 'Reflects the deletion recovery level currently in effect for secrets in the current vault.
            If it contains ''Purgeable'', the secret can be permanently deleted by a privileged user; otherwise,
            only the system can purge the secret, at the end of the retention interval. Known values are: "Purgeable",
            "Recoverable+Purgeable", "Recoverable", "Recoverable+ProtectedSubscription", "CustomizedRecoverable+Purgeable",
            "CustomizedRecoverable", and "CustomizedRecoverable+ProtectedSubscription".'
    DeletionRecoveryLevel:
      type: string
      enum:
      - Purgeable
      - Recoverable+Purgeable
      - Recoverable
      - Recoverable+ProtectedSubscription
      - CustomizedRecoverable+Purgeable
      - CustomizedRecoverable
      - CustomizedRecoverable+ProtectedSubscription
    SecretBundle:
      type: object
      description: A secret consisting of a value, id and its attributes.
      properties:
        value:
          type: string
          description: The secret value.
        id:
          type: string
          description: The secret id.
        contentType:
          type: string
          description: The content type of the secret.
        attributes:
          $ref: '#/components/schemas/SecretAttributes'
          description: The secret management attributes.
        tags:
          type: object
          properties: {}
          description: Application specific metadata in the form of key-value pairs.
        kid:
          type: string
          description: If this is a secret backing a KV certificate, then this field specifies the corresponding
            key backing the KV certificate.
        managed:
          type: boolean
          description: True if the secret's lifetime is managed by key vault. If this is a secret backing a certificate,
            then managed will be true.
        previousVersion:
          type: string
          description: The version of the previous certificate, if applicable. Applies only to certificates created
            after June 1, 2025. Certificates created before this date are not retroactively updated.
    SecretItem:
      type: object
      description: The secret item containing secret metadata.
      properties:
        id:
          type: string
          description: Secret identifier.
        attributes:
          $ref: '#/components/schemas/SecretAttributes'
          description: The secret management attributes.
        tags:
          type: object
          properties: {}
          description: Application specific metadata in the form of key-value pairs.
        contentType:
          type: string
          description: Type of the secret value such as a password.
        managed:
          type: boolean
          description: True if the secret's lifetime is managed by key vault. If this is a key backing a certificate,
            then managed will be true.
    PagedSecretItem:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/SecretItem'
        nextLink:
          type: string
    DeletedSecretItem:
      type: object
      description: The deleted secret item containing metadata about the deleted secret.
      properties:
        id:
          type: string
          description: Secret identifier.
        attributes:
          $ref: '#/components/schemas/SecretAttributes'
          description: The secret management attributes.
        tags:
          type: object
          properties: {}
          description: Application specific metadata in the form of key-value pairs.
        contentType:
          type: string
          description: Type of the secret value such as a password.
        managed:
          type: boolean
          description: True if the secret's lifetime is managed by key vault. If this is a key backing a certificate,
            then managed will be true.
        recoveryId:
          type: string
          description: The url of the recovery object, used to identify and recover the deleted secret.
        scheduledPurgeDate:
          type: string
          format: date-time
          description: The time when the secret is scheduled to be purged, in UTC.
        deletedDate:
          type: string
          format: date-time
          description: The time when the secret was deleted, in UTC.
    PagedDeletedSecretItem:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/DeletedSecretItem'
        nextLink:
          type: string
    DeletedSecretBundle:
      type: object
      description: A Deleted Secret consisting of its previous id, attributes and its tags, as well as information
        on when it will be purged.
      properties:
        value:
          type: string
          description: The secret value.
        id:
          type: string
          description: The secret id.
        contentType:
          type: string
          description: The content type of the secret.
        attributes:
          $ref: '#/components/schemas/SecretAttributes'
          description: The secret management attributes.
        tags:
          type: object
          properties: {}
          description: Application specific metadata in the form of key-value pairs.
        kid:
          type: string
          description: If this is a secret backing a KV certificate, then this field specifies the corresponding
            key backing the KV certificate.
        managed:
          type: boolean
          description: True if the secret's lifetime is managed by key vault. If this is a secret backing a certificate,
            then managed will be true.
        previousVersion:
          type: string
          description: The version of the previous certificate, if applicable. Applies only to certificates created
            after June 1, 2025. Certificates created before this date are not retroactively updated.
        recoveryId:
          type: string
          description: The url of the recovery object, used to identify and recover the deleted secret.
        scheduledPurgeDate:
          type: string
          format: date-time
          description: The time when the secret is scheduled to be purged, in UTC.
        deletedDate:
          type: string
          format: date-time
          description: The time when the secret was deleted, in UTC.
    BackupSecretResult:
      type: object
      description: The backup secret result, containing the backup blob.
      properties:
        value:
          type: string
          format: byte
          description: The backup blob containing the backed up secret.
paths:
  /secrets/{secret_name}/{secret_version}?api-version=2025-07-01:
    get:
      operationId: _KeyVaultClient_get_secret
      description: Get a specified secret from a given key vault. The GET operation is applicable to any secret
        stored in Azure Key Vault. This operation requires the secrets/get permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      - name: secret_version
        in: path
        required: true
        schema:
          type: string
        description: The version of the secret. This URI fragment is optional. If not specified, the latest version
          of the secret is returned. Required.
      - name: outContentType
        in: query
        required: false
        schema:
          type: string
        description: 'The media type (MIME type) of the certificate. If a supported format is specified, the certificate
          content is converted to the requested format. Currently, only PFX to PEM conversion is supported. If an
          unsupported format is specified, the request is rejected. If not specified, the certificate is returned
          in its original format without conversion. Known values are: "application/x-pkcs12" and "application/x-pem-file".
          Default value is None.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
      x-stackql-resource: secrets
      x-stackql-method: get_secret
      x-stackql-verb: SELECT
    patch:
      operationId: _KeyVaultClient_update_secret
      description: Updates the attributes associated with a specified secret in a given key vault. The UPDATE operation
        changes specified attributes of an existing stored secret. Attributes that are not specified in the request
        are left unchanged. The value of a secret itself cannot be changed. This operation requires the secrets/set
        permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      - name: secret_version
        in: path
        required: true
        schema:
          type: string
        description: The version of the secret. Required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  description: Type of the secret value such as a password.
                attributes:
                  $ref: '#/components/schemas/SecretAttributes'
                  description: The secret management attributes.
                tags:
                  type: object
                  properties: {}
                  description: Application specific metadata in the form of key-value pairs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
      x-stackql-resource: secrets
      x-stackql-method: update_secret
      x-stackql-verb: UPDATE
  /secrets?api-version=2025-07-01:
    get:
      operationId: _KeyVaultClient_get_secrets
      description: List secrets in a specified key vault. The Get Secrets operation is applicable to the entire
        vault. However, only the base secret identifier and its attributes are provided in the response. Individual
        secret versions are not listed in the response. This operation requires the secrets/list permission.
      parameters:
      - name: maxresults
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of results to return in a page. If not specified the service will return up
          to 25 results. Default value is None.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSecretItem'
      x-stackql-resource: secrets
      x-stackql-method: get_secrets
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.value
  /secrets/{secret_name}/versions?api-version=2025-07-01:
    get:
      operationId: _KeyVaultClient_get_secret_versions
      description: List all versions of the specified secret. The full secret identifier and attributes are provided
        in the response. No values are returned for the secrets. This operations requires the secrets/list permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      - name: maxresults
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of results to return in a page. If not specified the service will return up
          to 25 results. Default value is None.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSecretItem'
      x-stackql-resource: secret_versions
      x-stackql-method: get_secret_versions
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.value
  /deletedsecrets?api-version=2025-07-01:
    get:
      operationId: _KeyVaultClient_get_deleted_secrets
      description: Lists deleted secrets for the specified vault. The Get Deleted Secrets operation returns the
        secrets that have been deleted for a vault enabled for soft-delete. This operation requires the secrets/list
        permission.
      parameters:
      - name: maxresults
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of results to return in a page. If not specified the service will return up
          to 25 results. Default value is None.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDeletedSecretItem'
      x-stackql-resource: deleted_secrets
      x-stackql-method: get_deleted_secrets
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.value
  /deletedsecrets/{secret_name}?api-version=2025-07-01:
    get:
      operationId: _KeyVaultClient_get_deleted_secret
      description: Gets the specified deleted secret. The Get Deleted Secret operation returns the specified deleted
        secret along with its attributes. This operation requires the secrets/get permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedSecretBundle'
      x-stackql-resource: deleted_secrets
      x-stackql-method: get_deleted_secret
      x-stackql-verb: SELECT
    delete:
      operationId: _KeyVaultClient_purge_deleted_secret
      description: Permanently deletes the specified secret. The purge deleted secret operation removes the secret
        permanently, without the possibility of recovery. This operation can only be enabled on a soft-delete enabled
        vault. This operation requires the secrets/purge permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      responses:
        '204':
          description: Success (no content / accepted)
      x-stackql-resource: deleted_secrets
      x-stackql-method: purge_deleted_secret
      x-stackql-verb: DELETE
  /secrets/{secret_name}?api-version=2025-07-01:
    put:
      operationId: _KeyVaultClient_set_secret
      description: Sets a secret in a specified key vault. The SET operation adds a secret to the Azure Key Vault.
        If the named secret already exists, Azure Key Vault creates a new version of that secret. This operation
        requires the secrets/set permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. The value you provide may be copied globally for the purpose of running
          the service. The value provided should not include personally identifiable or sensitive information. Required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: The value of the secret. Required.
                tags:
                  type: object
                  properties: {}
                  description: Application specific metadata in the form of key-value pairs.
                contentType:
                  type: string
                  description: Type of the secret value such as a password.
                attributes:
                  $ref: '#/components/schemas/SecretAttributes'
                  description: The secret management attributes.
              required:
              - value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
      x-stackql-resource: secrets
      x-stackql-method: set_secret
      x-stackql-verb: REPLACE
    delete:
      operationId: _KeyVaultClient_delete_secret
      description: Deletes a secret from a specified key vault. The DELETE operation applies to any secret stored
        in Azure Key Vault. DELETE cannot be applied to an individual version of a secret. This operation requires
        the secrets/delete permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedSecretBundle'
      x-stackql-resource: secrets
      x-stackql-method: delete_secret
      x-stackql-verb: DELETE
  /deletedsecrets/{secret_name}/recover?api-version=2025-07-01:
    post:
      operationId: _KeyVaultClient_recover_deleted_secret
      description: Recovers the deleted secret to the latest version. Recovers the deleted secret in the specified
        vault. This operation can only be performed on a soft-delete enabled vault. This operation requires the
        secrets/recover permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the deleted secret. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
      x-stackql-resource: recover_deleted_secrets
      x-stackql-method: recover_deleted_secret
      x-stackql-verb: EXEC
  /secrets/{secret_name}/backup?api-version=2025-07-01:
    post:
      operationId: _KeyVaultClient_backup_secret
      description: Backs up the specified secret. Requests that a backup of the specified secret be downloaded to
        the client. All versions of the secret will be downloaded. This operation requires the secrets/backup permission.
      parameters:
      - name: secret_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the secret. Required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupSecretResult'
      x-stackql-resource: secrets
      x-stackql-method: backup_secret
      x-stackql-verb: EXEC
  /secrets/restore?api-version=2025-07-01:
    post:
      operationId: _KeyVaultClient_restore_secret
      description: Restores a backed up secret to a vault. Restores a backed up secret, and all its versions, to
        a vault. This operation requires the secrets/restore permission.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  format: byte
                  description: The backup blob associated with a secret bundle. Required.
              required:
              - value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretBundle'
      x-stackql-resource: secrets
      x-stackql-method: restore_secret
      x-stackql-verb: EXEC
