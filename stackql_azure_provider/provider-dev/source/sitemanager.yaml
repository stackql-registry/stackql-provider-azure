          description: First line of the street address.
        streetAddress2:
          type: string
          description: Second line of the street address.
        city:
          type: string
          description: City of the address.
        stateOrProvince:
          type: string
          description: State or province of the address.
        country:
          type: string
          description: Country of the address.
        postalCode:
          type: string
