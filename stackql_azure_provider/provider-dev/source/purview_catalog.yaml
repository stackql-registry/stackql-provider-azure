      operationId: Collection_create_or_update
      description: 'Creates or updates an entity to a collection. Existing entity is matched using its unique guid
        if supplied or by its unique attributes eg: qualifiedName. Map and array of collections are not well supported.
        E.g., array>, array>.'
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
        description: the collection unique name.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Success
      x-stackql-resource: collection
      x-stackql-method: create_or_update
      x-stackql-verb: INSERT
