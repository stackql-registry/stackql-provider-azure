info:
  title: Purview Catalog Client
  description: Purview Catalog Service is a fully managed cloud service whose users can discover the data sources
    they need and understand the data sources they find. At the same time, Data Catalog helps organizations get
    more value from their existing investments. This spec defines REST API of Purview Catalog Service.
  contact:
    name: StackQL Studios
    url: https://stackql.io/
    email: info@stackql.io
  version: 2022-03-01-preview-stackql-generated
  x-serviceAlias: purview_catalog
  x-sdkPackage: azure-purview-catalog
  x-plane: data
security:
- azure_auth:
  - user_impersonation
components:
  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas: {}
