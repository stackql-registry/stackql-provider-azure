        BackupId:
          type: string
        BackupLocation:
          type: string
        EpochOfLastBackupRecord:
          $ref: '#/components/schemas/Epoch'
        LsnOfLastBackupRecord:
          type: string
        FailureError:
          $ref: '#/components/schemas/FabricErrorError'
    RestoreProgressInfo:
      type: object
      description: Describes the progress of a restore operation on a partition.
      properties:
