      type: object
      description: Defines matching criteria to determine whether a service should be included as a child of an
        application in the cluster health chunk. The services are only returned if the parent application matches
        a filter specified in the cluster health chunk query description. One filter can match zero, one or multiple
        services, depending on its properties.
      properties:
        ServiceNameFilter:
          type: string
        HealthStateFilter:
          type: integer
        PartitionFilters:
          type: array
          items:
            $ref: '#/components/schemas/PartitionHealthStateFilter'
    PartitionHealthStateFilter:
      type: object
      description: Defines matching criteria to determine whether a partition should be included as a child of a
        service in the cluster health chunk. The partitions are only returned if the parent entities match a filter
        specified in the cluster health chunk query description. The parent service and application must be included
        in the cluster health chunk. One filter can match zero, one or multiple partitions, depending on its properties.
