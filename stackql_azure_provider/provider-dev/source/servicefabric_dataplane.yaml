      type: object
      description: Defines matching criteria to determine whether a node should be included in the returned cluster
        health chunk. One filter can match zero, one or multiple nodes, depending on its properties. Can be specified
        in the cluster health chunk query description.
      properties:
        NodeNameFilter:
          type: string
        HealthStateFilter:
          type: integer
    ApplicationHealthStateFilter:
      type: object
      description: Defines matching criteria to determine whether a application should be included in the cluster
        health chunk. One filter can match zero, one or multiple applications, depending on its properties.
      properties:
        ApplicationNameFilter:
          type: string
        ApplicationTypeNameFilter:
          type: string
        HealthStateFilter:
          type: integer
        ServiceFilters:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHealthStateFilter'
        DeployedApplicationFilters:
          type: array
          items:
            $ref: '#/components/schemas/DeployedApplicationHealthStateFilter'
