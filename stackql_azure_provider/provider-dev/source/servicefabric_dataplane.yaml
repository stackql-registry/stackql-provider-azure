      x-stackql-method: get_upgrade_progress
      x-stackql-verb: SELECT
  ? /Resources/Applications/{application_resource_name}/Services/{service_resource_name}/Replicas/{replica_name}/CodePackages/{code_package_name}/Logs
  : get:
      operationId: MeshCodePackage_get_container_logs
      description: Gets the logs from the container. Gets the logs for the container of the specified code package
        of the service replica.
      parameters:
      - name: service_resource_name
        in: path
        required: true
        schema:
          type: string
        description: The identity of the service.
      - name: replica_name
        in: path
        required: true
        schema:
          type: string
        description: Service Fabric replica name.
      - name: code_package_name
        in: path
        required: true
        schema:
          type: string
        description: The name of code package of the service.
      - name: application_resource_name
        in: path
        required: true
        schema:
          type: string
        description: The identity of the application.
      - name: Tail
        in: query
        required: false
        schema:
          type: string
        description: Number of lines to show from the end of the logs. Default is 100. 'all' to show the complete
