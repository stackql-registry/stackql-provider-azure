        PartitionIdFilter:
          type: string
        HealthStateFilter:
          type: integer
        ReplicaFilters:
          type: array
          items:
            $ref: '#/components/schemas/ReplicaHealthStateFilter'
    ReplicaHealthStateFilter:
      type: object
      description: Defines matching criteria to determine whether a replica should be included as a child of a partition
        in the cluster health chunk. The replicas are only returned if the parent entities match a filter specified
        in the cluster health chunk query description. The parent partition, service and application must be included
        in the cluster health chunk. One filter can match zero, one or multiple replicas, depending on its properties.
      properties:
        ReplicaOrInstanceIdFilter:
          type: string
        HealthStateFilter:
          type: integer
    DeployedApplicationHealthStateFilter:
      type: object
      description: Defines matching criteria to determine whether a deployed application should be included as a
        child of an application in the cluster health chunk. The deployed applications are only returned if the
        parent application matches a filter specified in the cluster health chunk query description. One filter
        can match zero, one or multiple deployed applications, depending on its properties.
      properties:
        NodeNameFilter:
          type: string
        HealthStateFilter:
          type: integer
        DeployedServicePackageFilters:
          type: array
          items:
            $ref: '#/components/schemas/DeployedServicePackageHealthStateFilter'
