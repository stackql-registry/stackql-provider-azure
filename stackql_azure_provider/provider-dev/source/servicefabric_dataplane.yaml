  /Services/{service_id}/$/Delete?api-version=6.0:
    post:
      operationId: ServiceFabricClientAPIs_delete_service
      description: Deletes an existing Service Fabric service. A service must be created before it can be deleted.
        By default, Service Fabric will try to close service replicas in a graceful manner and then delete the service.
        However, if the service is having issues closing the replica gracefully, the delete operation may take a
        long time or get stuck. Use the optional ForceRemove flag to skip the graceful close sequence and forcefully
        delete the service.
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: string
        description: The identity of the service. This ID is typically the full name of the service without the
          'fabric:' URI scheme. Starting from version 6.0, hierarchical names are delimited with the "~" character.
          For example, if the service name is "fabric:/myapp/app1/svc1", the service identity would be "myapp~app1~svc1"
          in 6.0+ and "myapp/app1/svc1" in previous versions.
      - name: ForceRemove
        in: query
        required: false
        schema:
          type: boolean
        description: Remove a Service Fabric application or service forcefully without going through the graceful
          shutdown sequence. This parameter can be used to forcefully delete an application or service for which
          delete is timing out due to issues in the service code that prevents graceful close of replicas.
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: The server timeout for performing the operation in seconds. This timeout specifies the time
          duration that the client is willing to wait for the requested operation to complete. The default value
          for this parameter is 60 seconds.
      responses:
        '204':
          description: Success (no content / accepted)
      x-stackql-resource: services
      x-stackql-method: delete_service
      x-stackql-verb: DELETE
