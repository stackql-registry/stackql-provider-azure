          that matches input with HealthState value Ok. The value is 2. - Warning - Filter that matches input with
          HealthState value Warning. The value is 4. - Error - Filter that matches input with HealthState value
          Error. The value is 8. - All - Filter that matches input with any HealthState value. The value is 65535.
