                  type: array
                  items:
                    $ref: '#/components/schemas/NodeHealthStateFilter'
                ApplicationFilters:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationHealthStateFilter'
                ClusterHealthPolicy:
