      properties:
        MetricName:
          type: string
        CurrentLoad:
          type: integer
          format: int64
        PredictedLoad:
          type: integer
          format: int64
    ReplicaMetricLoadDescription:
      type: object
      description: Specifies metric loads of a partition's specific secondary replica or instance.
      properties:
        NodeName:
          type: string
        ReplicaOrInstanceLoadEntries:
          type: array
          items:
            $ref: '#/components/schemas/MetricLoadDescription'
    PagedUpdatePartitionLoadResultList:
      type: object
