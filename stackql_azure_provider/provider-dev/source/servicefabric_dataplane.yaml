    PropertyBatchOperation:
      type: object
      description: 'Represents the base type for property operations that can be put into a batch and submitted.
        You probably want to use the sub-classes and not this class directly. Known sub-classes are: CheckExistsPropertyBatchOperation,
        CheckSequencePropertyBatchOperation, CheckValuePropertyBatchOperation, DeletePropertyBatchOperation, GetPropertyBatchOperation,
