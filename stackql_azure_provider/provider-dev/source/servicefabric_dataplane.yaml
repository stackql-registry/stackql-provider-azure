    ChaosTargetFilter:
      type: object
      description: Defines all filters for targeted Chaos faults, for example, faulting only certain node types
        or faulting only certain applications. If ChaosTargetFilter is not used, Chaos faults all cluster entities.
        If ChaosTargetFilter is used, Chaos faults only the entities that meet the ChaosTargetFilter specification.
        NodeTypeInclusionList and ApplicationInclusionList allow a union semantics only. It is not possible to specify
        an intersection of NodeTypeInclusionList and ApplicationInclusionList. For example, it is not possible to
        specify "fault this application only when it is on that node type." Once an entity is included in either
        NodeTypeInclusionList or ApplicationInclusionList, that entity cannot be excluded using ChaosTargetFilter.
        Even if applicationX does not appear in ApplicationInclusionList, in some Chaos iteration applicationX can
        be faulted because it happens to be on a node of nodeTypeY that is included in NodeTypeInclusionList. If
        both NodeTypeInclusionList and ApplicationInclusionList are null or empty, an ArgumentException is thrown.
