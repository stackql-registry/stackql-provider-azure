          type: string
        TimeStampUtc:
          type: string
          format: date-time
        RestoredEpoch:
          $ref: '#/components/schemas/Epoch'
        RestoredLsn:
          type: string
        FailureError:
          $ref: '#/components/schemas/FabricErrorError'
    PagedSubNameInfoList:
      type: object
      description: A paged list of Service Fabric names. The list is paged when all of the results cannot fit in
        a single message. The next set of results can be obtained by executing the same query with the continuation
        token provided in this list.
      properties:
        ContinuationToken:
          type: string
        IsConsistent:
          type: boolean
        SubNames:
          type: array
          items:
            type: string
    PropertyInfo:
      type: object
      description: Information about a Service Fabric property. All required parameters must be populated in order
        to send to Azure.
      properties:
        Name:
          type: string
