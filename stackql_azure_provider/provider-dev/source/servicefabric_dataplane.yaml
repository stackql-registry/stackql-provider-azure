      properties:
        kind:
          type: string
        description:
          type: string
        status:
          type: string
          description: 'Status of the resource. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'',
            ''Creating'', ''Deleting'', ''Failed'''
