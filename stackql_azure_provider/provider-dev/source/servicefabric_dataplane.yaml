          type: string
      required:
      - Code
    PagedBackupInfoList:
      type: object
      description: The list of backups. The list is paged when all of the results cannot fit in a single message.
        The next set of results can be obtained by executing the same query with the continuation token provided
        in this list.
      properties:
        ContinuationToken:
          type: string
        Items:
          type: array
          items:
            $ref: '#/components/schemas/BackupInfo'
    PartitionBackupConfigurationInfo:
      type: object
