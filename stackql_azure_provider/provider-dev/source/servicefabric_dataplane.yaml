      properties:
        Kind:
          type: string
        ErrorMessage:
          type: string
        OperationIndex:
          type: integer
      required:
      - Kind
paths:
  /Resources/Applications/{application_resource_name}?api-version=6.4-preview:
    get:
      operationId: MeshApplication_get
      description: Gets the Application resource with the given name. Gets the information about the Application
        resource with the given name. The information include the description and other properties of the Application.
      parameters:
      - name: application_resource_name
        in: path
        required: true
        schema:
          type: string
        description: The identity of the application.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResourceDescriptionFlattened'
      x-stackql-resource: mesh_application
      x-stackql-method: get
      x-stackql-verb: SELECT
      x-stackql-flatten: singleton
    put:
      operationId: MeshApplication_create_or_update
      description: Creates or updates a Application resource. Creates a Application resource with the specified
        name, description and properties. If Application resource with the same name exists, then it is updated
        with the specified description and properties.
      parameters:
      - name: application_resource_name
        in: path
        required: true
        schema:
          type: string
        description: The identity of the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                properties:
                  type: object
                  properties:
                    description:
                      type: string
                    services:
                      type: array
                      items:
                        $ref: '#/components/schemas/ServiceResourceDescription'
                    diagnostics:
                      $ref: '#/components/schemas/DiagnosticsDescription'
                    debugParams:
                      type: string
                identity:
                  $ref: '#/components/schemas/IdentityDescription'
              required:
              - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResourceDescription'
      x-stackql-resource: mesh_application
      x-stackql-method: create_or_update
      x-stackql-verb: INSERT
    delete:
      operationId: MeshApplication_delete
      description: Deletes the Application resource. Deletes the Application resource identified by the name.
      parameters:
      - name: application_resource_name
        in: path
        required: true
        schema:
          type: string
        description: The identity of the application.
      responses:
        '204':
          description: Success (no content / accepted)
      x-stackql-resource: mesh_application
      x-stackql-method: delete
      x-stackql-verb: DELETE
  /Resources/Applications?api-version=6.4-preview:
