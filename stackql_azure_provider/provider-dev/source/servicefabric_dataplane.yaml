          $ref: '#/components/schemas/PropertyValue'
        Metadata:
          $ref: '#/components/schemas/PropertyMetadata'
      required:
      - Name
      - Metadata
    PropertyValue:
      type: object
      description: 'Describes a Service Fabric property value. You probably want to use the sub-classes and not
        this class directly. Known sub-classes are: BinaryPropertyValue, Int64PropertyValue, DoublePropertyValue,
        StringPropertyValue, GuidPropertyValue All required parameters must be populated in order to send to Azure.'
      properties:
        Kind:
          type: string
      required:
      - Kind
    PropertyMetadata:
      type: object
      description: The metadata associated with a property, including the property's name.
      properties:
        TypeId:
          type: string
        CustomTypeId:
          type: string
        Parent:
          type: string
        SizeInBytes:
          type: integer
        LastModifiedUtcTimestamp:
          type: string
          format: date-time
        SequenceNumber:
          type: string
    PagedPropertyInfoList:
      type: object
      description: The paged list of Service Fabric properties under a given name. The list is paged when all of
        the results cannot fit in a single message. The next set of results can be obtained by executing the same
        query with the continuation token provided in this list.
      properties:
        ContinuationToken:
          type: string
        IsConsistent:
          type: boolean
        Properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyInfo'
    UpgradeOrchestrationServiceStateSummary:
      type: object
      description: Service state summary of Service Fabric Upgrade Orchestration Service.
      properties:
        CurrentCodeVersion:
          type: string
        CurrentManifestVersion:
          type: string
        TargetCodeVersion:
          type: string
        TargetManifestVersion:
          type: string
        PendingUpgradeType:
          type: string
    RollingUpgradeUpdateDescription:
      type: object
      description: Describes the parameters for updating a rolling upgrade of application or cluster. All required
        parameters must be populated in order to send to Azure.
      properties:
        RollingUpgradeMode:
          type: string
        ForceRestart:
          type: boolean
        ReplicaSetCheckTimeoutInMilliseconds:
          type: integer
          format: int64
        FailureAction:
          type: string
        HealthCheckWaitDurationInMilliseconds:
          type: string
        HealthCheckStableDurationInMilliseconds:
          type: string
        HealthCheckRetryTimeoutInMilliseconds:
          type: string
        UpgradeTimeoutInMilliseconds:
          type: string
        UpgradeDomainTimeoutInMilliseconds:
          type: string
        InstanceCloseDelayDurationInSeconds:
          type: integer
          format: int64
      required:
      - RollingUpgradeMode
    ValidateClusterUpgradeResult:
      type: object
      description: Specifies result of validating a cluster upgrade.
      properties:
        ServiceHostUpgradeImpact:
          type: string
        ValidationDetails:
          type: string
    ApplicationCapacityDescription:
      type: object
      description: Describes capacity information for services of this application. This description can be used
        for describing the following. - Reserving the capacity for the services on the nodes - Limiting the total
        number of nodes that services of this application can run on - Limiting the custom capacity metrics to limit
        the total consumption of this metric by the services of this application.
      properties:
        MinimumNodes:
          type: integer
          format: int64
        MaximumNodes:
          type: integer
          format: int64
        ApplicationMetrics:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationMetricDescription'
    ApplicationMetricDescription:
      type: object
      description: Describes capacity information for a custom resource balancing metric. This can be used to limit
        the total consumption of this metric by the services of this application.
      properties:
        Name:
          type: string
        MaximumCapacity:
          type: integer
          format: int64
        ReservationCapacity:
          type: integer
          format: int64
        TotalApplicationCapacity:
          type: integer
          format: int64
    ResolvedServicePartition:
      type: object
      description: Information about a service partition and its associated endpoints. All required parameters must
        be populated in order to send to Azure.
      properties:
        Name:
          type: string
        PartitionInformation:
          $ref: '#/components/schemas/PartitionInformation'
