openapi: 3.0.0
servers:
- url: https://{endpoint}
  variables:
    endpoint:
      default: ''
      description: The service endpoint host (no scheme).
info:
  title: Servicefabric Dataplane
  description: This is the Microsoft Azure Service Fabric Client Library.
  contact:
    name: StackQL Studios
    url: https://stackql.io/
    email: info@stackql.io
  version: 8.2-stackql-generated
  x-serviceAlias: servicefabric_dataplane
  x-sdkPackage: azure-servicefabric
  x-plane: data
security:
- azure_auth:
  - user_impersonation
components:
  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ServiceResourceDescription:
      type: object
      description: This type describes a service resource. Variables are only populated by the server, and will
        be ignored when sending a request. All required parameters must be populated in order to send to Azure.
      properties:
        name:
          type: string
        properties:
          type: object
          properties:
            osType:
              type: string
            codePackages:
              type: array
              items:
                $ref: '#/components/schemas/ContainerCodePackageProperties'
            networkRefs:
              type: array
              items:
                $ref: '#/components/schemas/NetworkRef'
            diagnostics:
              $ref: '#/components/schemas/DiagnosticsRef'
            description:
              type: string
            replicaCount:
              type: integer
            executionPolicy:
              $ref: '#/components/schemas/ExecutionPolicy'
            autoScalingPolicies:
              type: array
              items:
                $ref: '#/components/schemas/AutoScalingPolicy'
            status:
              type: string
              description: 'Status of the service. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'',
                ''Creating'', ''Deleting'', ''Failed'''
            statusDetails:
              type: string
              description: Gives additional information about the current status of the service.
            healthState:
              type: string
              description: 'Describes the health state of an application resource. Possible values include: ''Invalid'',
                ''Ok'', ''Warning'', ''Error'', ''Unknown'''
            unhealthyEvaluation:
              type: string
              description: When the service's health state is not 'Ok', this additional details from service fabric
                Health Manager for the user to know why the service is marked unhealthy.
            identityRefs:
              type: array
              items:
                $ref: '#/components/schemas/ServiceIdentity'
            dnsName:
              type: string
      required:
      - name
      - properties
    ContainerCodePackageProperties:
      type: object
      description: Describes a container and its runtime properties. Variables are only populated by the server,
        and will be ignored when sending a request. All required parameters must be populated in order to send to
        Azure.
      properties:
        name:
          type: string
        image:
          type: string
        imageRegistryCredential:
          $ref: '#/components/schemas/ImageRegistryCredential'
        entryPoint:
          type: string
        commands:
          type: array
          items:
            type: string
        environmentVariables:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ContainerLabel'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointProperties'
        resources:
          $ref: '#/components/schemas/ResourceRequirements'
        volumeRefs:
          type: array
          items:
            $ref: '#/components/schemas/VolumeReference'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationScopedVolume'
        diagnostics:
          $ref: '#/components/schemas/DiagnosticsRef'
        reliableCollectionsRefs:
          type: array
          items:
            $ref: '#/components/schemas/ReliableCollectionsRef'
        instanceView:
          $ref: '#/components/schemas/ContainerInstanceView'
          description: Runtime information of a container instance.
        livenessProbe:
          type: array
          items:
            $ref: '#/components/schemas/Probe'
        readinessProbe:
          type: array
          items:
            $ref: '#/components/schemas/Probe'
      required:
      - name
      - image
      - resources
    ImageRegistryCredential:
      type: object
      description: Image registry credential. All required parameters must be populated in order to send to Azure.
      properties:
        server:
          type: string
        username:
          type: string
        passwordType:
          type: string
        password:
          type: string
      required:
      - server
      - username
    EnvironmentVariable:
      type: object
      description: Describes an environment variable for the container.
      properties:
        type:
          type: string
        name:
          type: string
        value:
          type: string
    Setting:
      type: object
      description: Describes a setting for the container. The setting file path can be fetched from environment
        variable "Fabric_SettingPath". The path for Windows container is "C:\secrets". The path for Linux container
        is "/var/secrets".
      properties:
        type:
          type: string
        name:
          type: string
        value:
          type: string
    ContainerLabel:
      type: object
      description: Describes a container label. All required parameters must be populated in order to send to Azure.
      properties:
        name:
          type: string
        value:
          type: string
      required:
      - name
      - value
    EndpointProperties:
      type: object
      description: Describes a container endpoint. All required parameters must be populated in order to send to
        Azure.
      properties:
        name:
          type: string
        port:
          type: integer
      required:
      - name
    ResourceRequirements:
      type: object
      description: This type describes the resource requirements for a container or a service. All required parameters
        must be populated in order to send to Azure.
      properties:
        requests:
          $ref: '#/components/schemas/ResourceRequests'
        limits:
          $ref: '#/components/schemas/ResourceLimits'
      required:
      - requests
    ResourceRequests:
      type: object
      description: This type describes the requested resources for a given container. It describes the least amount
        of resources required for the container. A container can consume more than requested resources up to the
        specified limits before being restarted. Currently, the requested resources are treated as limits. All required
        parameters must be populated in order to send to Azure.
      properties:
        memoryInGB:
          type: number
        cpu:
          type: number
      required:
      - memoryInGB
      - cpu
    ResourceLimits:
      type: object
      description: This type describes the resource limits for a given container. It describes the most amount of
        resources a container is allowed to use before being restarted.
      properties:
        memoryInGB:
          type: number
        cpu:
          type: number
    VolumeReference:
      type: object
      description: Describes a reference to a volume resource. All required parameters must be populated in order
        to send to Azure.
      properties:
        name:
          type: string
        readOnly:
          type: boolean
        destinationPath:
          type: string
      required:
      - name
      - destinationPath
    ApplicationScopedVolume:
      type: object
      description: Describes a volume whose lifetime is scoped to the application's lifetime. All required parameters
        must be populated in order to send to Azure.
      properties:
        name:
          type: string
        readOnly:
          type: boolean
        destinationPath:
          type: string
        creationParameters:
          $ref: '#/components/schemas/ApplicationScopedVolumeCreationParameters'
      required:
      - name
      - destinationPath
      - creationParameters
    ApplicationScopedVolumeCreationParameters:
      type: object
      description: 'Describes parameters for creating application-scoped volumes. You probably want to use the sub-classes
        and not this class directly. Known sub-classes are: ApplicationScopedVolumeCreationParametersServiceFabricVolumeDisk
        All required parameters must be populated in order to send to Azure.'
      properties:
        description:
          type: string
        kind:
          type: string
      required:
      - kind
    DiagnosticsRef:
      type: object
      description: Reference to sinks in DiagnosticsDescription.
      properties:
        enabled:
          type: boolean
        sinkRefs:
          type: array
          items:
            type: string
    ReliableCollectionsRef:
      type: object
      description: Specifying this parameter adds support for reliable collections. All required parameters must
        be populated in order to send to Azure.
      properties:
        name:
          type: string
        doNotPersistState:
          type: boolean
      required:
      - name
    ContainerInstanceView:
      type: object
      description: Runtime information of a container instance.
      properties:
        restartCount:
          type: integer
        currentState:
          $ref: '#/components/schemas/ContainerState'
        previousState:
          $ref: '#/components/schemas/ContainerState'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ContainerEvent'
    ContainerState:
      type: object
      description: The container state.
      properties:
        state:
          type: string
        startTime:
          type: string
          format: date-time
        exitCode:
          type: string
        finishTime:
          type: string
          format: date-time
        detailStatus:
          type: string
    ContainerEvent:
      type: object
      description: A container event.
      properties:
        name:
          type: string
        count:
          type: integer
        firstTimestamp:
          type: string
        lastTimestamp:
          type: string
        message:
          type: string
        type:
          type: string
    Probe:
      type: object
      description: Probes have a number of fields that you can use to control their behavior.
      properties:
        initialDelaySeconds:
          type: integer
        periodSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        successThreshold:
          type: integer
        failureThreshold:
          type: integer
        exec:
          $ref: '#/components/schemas/ProbeExec'
        httpGet:
          $ref: '#/components/schemas/ProbeHttpGet'
        tcpSocket:
          $ref: '#/components/schemas/ProbeTcpSocket'
    ProbeExec:
      type: object
      description: Exec command to run inside the container. All required parameters must be populated in order
        to send to Azure.
      properties:
        command:
          type: string
      required:
      - command
    ProbeHttpGet:
      type: object
      description: Http probe for the container. All required parameters must be populated in order to send to Azure.
      properties:
        port:
          type: integer
        path:
          type: string
        host:
          type: string
        httpHeaders:
          type: array
          items:
            $ref: '#/components/schemas/ProbeHttpGetHeaders'
        scheme:
          type: string
      required:
      - port
    ProbeHttpGetHeaders:
      type: object
      description: Http headers. All required parameters must be populated in order to send to Azure.
      properties:
        name:
          type: string
        value:
          type: string
      required:
      - name
      - value
    ProbeTcpSocket:
      type: object
      description: Tcp port to probe inside the container. All required parameters must be populated in order to
        send to Azure.
      properties:
        port:
          type: integer
      required:
      - port
    NetworkRef:
      type: object
      description: Describes a network reference in a service.
      properties:
        name:
          type: string
        endpointRefs:
          type: array
          items:
            $ref: '#/components/schemas/EndpointRef'
    EndpointRef:
      type: object
      description: Describes a reference to a service endpoint.
      properties:
        name:
          type: string
    ExecutionPolicy:
      type: object
      description: 'The execution policy of the service. You probably want to use the sub-classes and not this class
        directly. Known sub-classes are: DefaultExecutionPolicy, RunToCompletionExecutionPolicy All required parameters
        must be populated in order to send to Azure.'
      properties:
        type:
          type: string
      required:
      - type
    AutoScalingPolicy:
      type: object
      description: Describes the auto scaling policy. All required parameters must be populated in order to send
        to Azure.
      properties:
        name:
          type: string
        trigger:
          $ref: '#/components/schemas/AutoScalingTrigger'
        mechanism:
          $ref: '#/components/schemas/AutoScalingMechanism'
      required:
      - name
      - trigger
      - mechanism
    AutoScalingTrigger:
      type: object
      description: 'Describes the trigger for performing auto scaling operation. You probably want to use the sub-classes
        and not this class directly. Known sub-classes are: AverageLoadScalingTrigger All required parameters must
        be populated in order to send to Azure.'
      properties:
        kind:
          type: string
      required:
      - kind
    AutoScalingMechanism:
      type: object
      description: 'Describes the mechanism for performing auto scaling operation. Derived classes will describe
        the actual mechanism. You probably want to use the sub-classes and not this class directly. Known sub-classes
        are: AddRemoveReplicaScalingMechanism All required parameters must be populated in order to send to Azure.'
      properties:
        kind:
          type: string
      required:
      - kind
    ServiceIdentity:
      type: object
      description: Map service identity friendly name to an application identity.
      properties:
        name:
          type: string
        identityRef:
          type: string
    DiagnosticsDescription:
      type: object
      description: Describes the diagnostics options available.
      properties:
        sinks:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsSinkProperties'
        enabled:
          type: boolean
        defaultSinkRefs:
          type: array
          items:
            type: string
    DiagnosticsSinkProperties:
      type: object
      description: 'Properties of a DiagnosticsSink. You probably want to use the sub-classes and not this class
        directly. Known sub-classes are: AzureInternalMonitoringPipelineSinkDescription All required parameters
        must be populated in order to send to Azure.'
      properties:
        name:
          type: string
        description:
          type: string
        kind:
          type: string
      required:
      - kind
    IdentityDescription:
      type: object
      description: Information describing the identities associated with this application. All required parameters
        must be populated in order to send to Azure.
      properties:
        tokenServiceEndpoint:
          type: string
        type:
          type: string
        tenantId:
          type: string
        principalId:
          type: string
        userAssignedIdentities:
          type: object
          properties: {}
      required:
      - type
    ApplicationResourceDescriptionFlattened:
      type: object
      description: Flattened view of ApplicationResourceDescription ('properties' hoisted to the top level).
      properties:
        name:
          type: string
        identity:
          $ref: '#/components/schemas/IdentityDescription'
        description:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceResourceDescription'
        diagnostics:
          $ref: '#/components/schemas/DiagnosticsDescription'
        debugParams:
          type: string
        serviceNames:
          type: array
          items:
            type: string
          description: Names of the services in the application.
        status:
          type: string
          description: 'Status of the application. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'',
            ''Creating'', ''Deleting'', ''Failed'''
        statusDetails:
          type: string
          description: Gives additional information about the current status of the application.
        healthState:
          type: string
          description: 'Describes the health state of an application resource. Possible values include: ''Invalid'',
            ''Ok'', ''Warning'', ''Error'', ''Unknown'''
        unhealthyEvaluation:
          type: string
          description: When the application's health state is not 'Ok', this additional details from service fabric
            Health Manager for the user to know why the application is marked unhealthy.
    ApplicationResourceDescription:
      type: object
      description: This type describes a application resource. Variables are only populated by the server, and will
        be ignored when sending a request. All required parameters must be populated in order to send to Azure.
      properties:
        name:
          type: string
        properties:
          type: object
          properties:
            description:
              type: string
            services:
              type: array
              items:
                $ref: '#/components/schemas/ServiceResourceDescription'
            diagnostics:
              $ref: '#/components/schemas/DiagnosticsDescription'
            debugParams:
              type: string
            serviceNames:
              type: array
              items:
                type: string
              description: Names of the services in the application.
            status:
              type: string
              description: 'Status of the application. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'',
                ''Creating'', ''Deleting'', ''Failed'''
            statusDetails:
              type: string
              description: Gives additional information about the current status of the application.
            healthState:
              type: string
              description: 'Describes the health state of an application resource. Possible values include: ''Invalid'',
                ''Ok'', ''Warning'', ''Error'', ''Unknown'''
            unhealthyEvaluation:
              type: string
              description: When the application's health state is not 'Ok', this additional details from service
                fabric Health Manager for the user to know why the application is marked unhealthy.
        identity:
          $ref: '#/components/schemas/IdentityDescription'
      required:
      - name
    PagedApplicationResourceDescriptionList:
      type: object
      description: The list of application resources. The list is paged when all of the results cannot fit in a
        single message. The next set of results can be obtained by executing the same query with the continuation
        token provided in this list.
      properties:
        ContinuationToken:
          type: string
        Items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationResourceDescription'
    ServiceUpgradeProgress:
      type: object
      description: Information about how many replicas are completed or pending for a specific service during upgrade.
      properties:
        ServiceName:
          type: string
        CompletedReplicaCount:
          type: string
        PendingReplicaCount:
          type: string
    ApplicationResourceUpgradeProgressInfo:
      type: object
      description: This type describes an application resource upgrade.
      properties:
        Name:
          type: string
        TargetApplicationTypeVersion:
          type: string
        StartTimestampUtc:
          type: string
        UpgradeState:
          type: string
        PercentCompleted:
          type: string
        ServiceUpgradeProgress:
          type: array
          items:
            $ref: '#/components/schemas/ServiceUpgradeProgress'
        RollingUpgradeMode:
          type: string
        UpgradeDuration:
          type: string
        ApplicationUpgradeStatusDetails:
          type: string
        UpgradeReplicaSetCheckTimeoutInSeconds:
          type: integer
          format: int64
        FailureTimestampUtc:
          type: string
    ContainerLogs:
      type: object
      description: Container logs.
      properties:
        Content:
          type: string
    TcpConfig:
      type: object
      description: Describes the tcp configuration for external connectivity for this network. All required parameters
        must be populated in order to send to Azure.
      properties:
        name:
          type: string
        port:
          type: integer
        destination:
          $ref: '#/components/schemas/GatewayDestination'
      required:
      - name
      - port
      - destination
    GatewayDestination:
      type: object
      description: Describes destination endpoint for routing traffic. All required parameters must be populated
        in order to send to Azure.
      properties:
        applicationName:
          type: string
        serviceName:
          type: string
        endpointName:
          type: string
      required:
      - applicationName
      - serviceName
      - endpointName
    HttpConfig:
      type: object
      description: Describes the http configuration for external connectivity for this network. All required parameters
        must be populated in order to send to Azure.
      properties:
        name:
          type: string
        port:
          type: integer
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/HttpHostConfig'
      required:
      - name
      - port
      - hosts
    HttpHostConfig:
      type: object
      description: Describes the hostname properties for http routing. All required parameters must be populated
        in order to send to Azure.
      properties:
        name:
          type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/HttpRouteConfig'
      required:
      - name
      - routes
    HttpRouteConfig:
      type: object
      description: Describes the hostname properties for http routing. All required parameters must be populated
        in order to send to Azure.
      properties:
        name:
          type: string
        match:
          $ref: '#/components/schemas/HttpRouteMatchRule'
        destination:
          $ref: '#/components/schemas/GatewayDestination'
      required:
      - name
      - match
      - destination
    HttpRouteMatchRule:
      type: object
      description: Describes a rule for http route matching. All required parameters must be populated in order
        to send to Azure.
      properties:
        path:
          $ref: '#/components/schemas/HttpRouteMatchPath'
        headers:
          type: array
          items:
            $ref: '#/components/schemas/HttpRouteMatchHeader'
      required:
      - path
    HttpRouteMatchPath:
      type: object
      description: Path to match for routing. Variables are only populated by the server, and will be ignored when
        sending a request. All required parameters must be populated in order to send to Azure.
      properties:
        value:
          type: string
        rewrite:
          type: string
        type:
          type: string
          description: 'Required. how to match value in the Uri. Default value: "prefix" .'
      required:
      - value
      - type
    HttpRouteMatchHeader:
      type: object
      description: Describes header information for http route matching. All required parameters must be populated
        in order to send to Azure.
      properties:
        name:
          type: string
        value:
          type: string
        type:
          type: string
      required:
      - name
    GatewayResourceDescriptionFlattened:
      type: object
      description: Flattened view of GatewayResourceDescription ('properties' hoisted to the top level).
      properties:
        name:
          type: string
        description:
          type: string
        sourceNetwork:
          $ref: '#/components/schemas/NetworkRef'
        destinationNetwork:
          $ref: '#/components/schemas/NetworkRef'
        tcp:
          type: array
          items:
            $ref: '#/components/schemas/TcpConfig'
        http:
          type: array
          items:
            $ref: '#/components/schemas/HttpConfig'
        status:
          type: string
          description: 'Status of the resource. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'',
            ''Creating'', ''Deleting'', ''Failed'''
        statusDetails:
          type: string
          description: Gives additional information about the current status of the gateway.
        ipAddress:
          type: string
          description: IP address of the gateway. This is populated in the response and is ignored for incoming
            requests.
    GatewayResourceDescription:
      type: object
      description: This type describes a gateway resource. Variables are only populated by the server, and will
        be ignored when sending a request. All required parameters must be populated in order to send to Azure.
      properties:
        name:
          type: string
        properties:
          type: object
          properties:
            description:
              type: string
            sourceNetwork:
              $ref: '#/components/schemas/NetworkRef'
            destinationNetwork:
              $ref: '#/components/schemas/NetworkRef'
            tcp:
              type: array
              items:
                $ref: '#/components/schemas/TcpConfig'
            http:
              type: array
              items:
                $ref: '#/components/schemas/HttpConfig'
            status:
              type: string
              description: 'Status of the resource. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'',
                ''Creating'', ''Deleting'', ''Failed'''
            statusDetails:
              type: string
              description: Gives additional information about the current status of the gateway.
            ipAddress:
              type: string
              description: IP address of the gateway. This is populated in the response and is ignored for incoming
                requests.
      required:
      - name
      - properties
    PagedGatewayResourceDescriptionList:
      type: object
      description: The list of gateway resources. The list is paged when all of the results cannot fit in a single
        message. The next set of results can be obtained by executing the same query with the continuation token
        provided in this list.
      properties:
        ContinuationToken:
          type: string
        Items:
          type: array
          items:
            $ref: '#/components/schemas/GatewayResourceDescription'
    NetworkResourceProperties:
      type: object
      description: 'Describes properties of a network resource. You probably want to use the sub-classes and not
        this class directly. Known sub-classes are: LocalNetworkResourceProperties Variables are only populated
        by the server, and will be ignored when sending a request. All required parameters must be populated in
        order to send to Azure.'
      properties:
        kind:
          type: string
        description:
          type: string
        status:
          type: string
          description: 'Status of the network. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'', ''Creating'',
            ''Deleting'', ''Failed'''
        statusDetails:
          type: string
          description: Gives additional information about the current status of the network.
      required:
      - kind
    NetworkResourceDescriptionFlattened:
      type: object
      description: Flattened view of NetworkResourceDescription ('properties' hoisted to the top level).
      properties:
        name:
          type: string
        kind:
          type: string
        description:
          type: string
        status:
          type: string
          description: 'Status of the network. Possible values include: ''Unknown'', ''Ready'', ''Upgrading'', ''Creating'',
            ''Deleting'', ''Failed'''
        statusDetails:
          type: string
          description: Gives additional information about the current status of the network.
    NetworkResourceDescription:
      type: object
      description: This type describes a network resource. All required parameters must be populated in order to
        send to Azure.
      properties:
        name:
          type: string
        properties:
          $ref: '#/components/schemas/NetworkResourceProperties'
      required:
      - name
      - properties
    PagedNetworkResourceDescriptionList:
      type: object
      description: The list of network resources. The list is paged when all of the results cannot fit in a single
        message. The next set of results can be obtained by executing the same query with the continuation token
        provided in this list.
      properties:
        ContinuationToken:
          type: string
        Items:
          type: array
          items:
            $ref: '#/components/schemas/NetworkResourceDescription'
    SecretResourceProperties:
      type: object
      description: 'Describes the properties of a secret resource. You probably want to use the sub-classes and
