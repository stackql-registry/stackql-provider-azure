      properties:
        PartitionId:
          type: string
        PartitionErrorCode:
          type: integer
    RepairTargetDescriptionBase:
      type: object
      description: 'Describes the entities targeted by a repair action. This type supports the Service Fabric platform;
        it is not meant to be used directly from your code. You probably want to use the sub-classes and not this
        class directly. Known sub-classes are: NodeRepairTargetDescription All required parameters must be populated
        in order to send to Azure.'
      properties:
        Kind:
          type: string
      required:
      - Kind
    RepairImpactDescriptionBase:
      type: object
      description: 'Describes the expected impact of executing a repair task. This type supports the Service Fabric
        platform; it is not meant to be used directly from your code. You probably want to use the sub-classes and
        not this class directly. Known sub-classes are: NodeRepairImpactDescription All required parameters must
        be populated in order to send to Azure.'
      properties:
        Kind:
          type: string
      required:
      - Kind
    RepairTaskHistory:
      type: object
      description: A record of the times when the repair task entered each state. This type supports the Service
        Fabric platform; it is not meant to be used directly from your code.
      properties:
        CreatedUtcTimestamp:
          type: string
          format: date-time
        ClaimedUtcTimestamp:
          type: string
          format: date-time
        PreparingUtcTimestamp:
          type: string
          format: date-time
        ApprovedUtcTimestamp:
          type: string
          format: date-time
        ExecutingUtcTimestamp:
          type: string
          format: date-time
        RestoringUtcTimestamp:
          type: string
          format: date-time
        CompletedUtcTimestamp:
          type: string
          format: date-time
        PreparingHealthCheckStartUtcTimestamp:
          type: string
          format: date-time
        PreparingHealthCheckEndUtcTimestamp:
          type: string
          format: date-time
        RestoringHealthCheckStartUtcTimestamp:
          type: string
          format: date-time
        RestoringHealthCheckEndUtcTimestamp:
          type: string
          format: date-time
    RepairTaskUpdateInfo:
      type: object
      description: Describes the result of an operation that created or updated a repair task. This type supports
        the Service Fabric platform; it is not meant to be used directly from your code. All required parameters
        must be populated in order to send to Azure.
      properties:
