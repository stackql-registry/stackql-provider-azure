openapi: 3.0.0
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      default: ''
      description: The service endpoint.
info:
  title: Access Control Client
  description: AccessControlClient.
  contact:
    name: StackQL Studios
    url: https://stackql.io/
    email: info@stackql.io
  version: 2020-12-01-stackql-generated
  x-serviceAlias: synapse_accesscontrol
  x-sdkPackage: azure-synapse-accesscontrol
  x-plane: data
security:
- azure_auth:
  - user_impersonation
components:
  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    PagedRolesListResponse:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            properties: {}
        nextLink:
          type: string
    RoleAssignmentDetails:
      type: object
      description: Role Assignment response details.
      properties:
        id:
          type: string
        roleDefinitionId:
          type: string
        principalId:
          type: string
        scope:
          type: string
        principalType:
          type: string
    RoleAssignmentDetailsList:
      type: object
      description: Role Assignment response details.
      properties:
        count:
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentDetails'
    SubjectInfo:
      type: object
      description: Subject details. All required parameters must be populated in order to send to Azure.
      properties:
        principalId:
          type: string
        groupIds:
          type: array
          items:
            type: string
      required:
      - principalId
    RequiredAction:
      type: object
      description: Action Info. All required parameters must be populated in order to send to Azure.
      properties:
        id:
          type: string
        isDataAction:
          type: boolean
      required:
      - id
      - isDataAction
    CheckPrincipalAccessResponse:
      type: object
      description: Check access response details.
      properties:
        accessDecisions:
          type: array
          items:
            $ref: '#/components/schemas/CheckAccessDecision'
    CheckAccessDecision:
      type: object
      description: Check access response details.
      properties:
        accessDecision:
          type: string
        actionId:
          type: string
        roleAssignment:
          $ref: '#/components/schemas/RoleAssignmentDetails'
    SynapseRbacPermission:
      type: object
      description: Synapse role definition details.
      properties:
        actions:
          type: array
          items:
            type: string
        notActions:
          type: array
          items:
            type: string
        dataActions:
          type: array
          items:
            type: string
        notDataActions:
          type: array
          items:
            type: string
    SynapseRoleDefinition:
      type: object
      description: Synapse role definition details.
      properties:
        id:
          type: string
        name:
          type: string
        isBuiltIn:
          type: boolean
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SynapseRbacPermission'
        scopes:
          type: array
          items:
            type: string
        availabilityStatus:
          type: string
