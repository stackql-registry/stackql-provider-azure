              schema:
                $ref: '#/components/schemas/PolicyCertificatesModifyResponse'
      x-stackql-resource: policy_certificates
      x-stackql-method: add
      x-stackql-verb: EXEC
  /certificates:remove?api-version=2025-06-01:
    post:
      operationId: PolicyCertificates_remove
      description: Removes the specified policy management certificate. Note that the final policy management certificate
