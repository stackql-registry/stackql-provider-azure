      x-stackql-method: attest_sgx_enclave
      x-stackql-verb: EXEC
  /attest/AzureGuest?api-version=2025-06-01:
    post:
      operationId: Attestation_attest_azure_guest
      description: Attest to an Azure Guest VM. Processes an Azure Guest TCG Log, producing an artifact. The type
        of artifact produced is dependent upon attestation policy.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SealedAttestationResponse'
      x-stackql-resource: attestation
      x-stackql-method: attest_azure_guest
      x-stackql-verb: EXEC
  /attest/Tpm?api-version=2025-06-01:
    post:
      operationId: Attestation_attest_tpm
      description: Attest a Virtualization-based Security (VBS) enclave. Processes attestation evidence from a VBS
        enclave, producing an attestation result. The attestation result produced is dependent upon the attestation
        policy.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpmAttestationResponse'
      x-stackql-resource: attestation
      x-stackql-method: attest_tpm
      x-stackql-verb: EXEC
  /attest/SevSnpVm?api-version=2025-06-01:
    post:
      operationId: Attestation_attest_sev_snp_vm
      description: Attest to an SEV SNP Virtual Machine. Processes a SEV SNP Boot chain. The type of artifact produced
        is dependent upon attestation policy.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationResponse'
      x-stackql-resource: attestation
      x-stackql-method: attest_sev_snp_vm
      x-stackql-verb: EXEC
  /attest/TdxVm?api-version=2025-06-01:
    post:
      operationId: Attestation_attest_tdx_vm
      description: Attest to a TDX Virtual Machine. Processes an TDX quote, producing an artifact. The type of artifact
        produced is dependent upon attestation policy.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationResponse'
      x-stackql-resource: attestation
      x-stackql-method: attest_tdx_vm
      x-stackql-verb: EXEC
  /.well-known/openid-configuration?api-version=2025-06-01:
    get:
      operationId: MetadataConfiguration_get
      description: Retrieves the OpenID Configuration data for the Azure Attestation Service. Retrieves metadata
        about the attestation signing keys in use by the attestation service.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfigurationResponse'
      x-stackql-resource: metadata_configuration
      x-stackql-method: get
      x-stackql-verb: SELECT
  /certificates?api-version=2025-06-01:
    get:
      operationId: PolicyCertificates_get
      description: Retrieves the set of certificates used to express policy for the current tenant. Retrieves the
        set of certificates used to express policy for the current tenant.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCertificatesResponse'
      x-stackql-resource: policy_certificates
      x-stackql-method: get
      x-stackql-verb: SELECT
  /certificates:add?api-version=2025-06-01:
    post:
      operationId: PolicyCertificates_add
      description: Adds a new attestation policy certificate to the set of policy management certificates. Adds
