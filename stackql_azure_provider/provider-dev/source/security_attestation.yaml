      description: Sets the policy for a given attestation type. Sets the policy for a given attestation type.
      parameters:
      - name: attestation_type
        in: path
        required: true
        schema:
          type: string
        description: 'Specifies the trusted execution environment to be used to validate the evidence. Known values
          are: "SgxEnclave", "OpenEnclave", "AzureGuest", "SevSnpVm", "Tpm", and "TdxVm". Required.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
