      x-stackql-method: remove
      x-stackql-verb: EXEC
  /policies/{attestation_type}?api-version=2025-06-01:
    get:
      operationId: Policy_get
      description: Retrieves the current policy for an attestation type. Retrieves the current policy for an attestation
        type.
      parameters:
      - name: attestation_type
        in: path
        required: true
        schema:
          type: string
        description: 'Specifies the trusted execution environment to be used to validate the evidence. Known values
          are: "SgxEnclave", "OpenEnclave", "AzureGuest", "SevSnpVm", "Tpm", and "TdxVm". Required.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
      x-stackql-resource: policy
      x-stackql-method: get
      x-stackql-verb: SELECT
    put:
