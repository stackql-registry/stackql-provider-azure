        '204':
          description: Success (no content / accepted)
      x-stackql-resource: exports
      x-stackql-method: export
      x-stackql-verb: EXEC
  /authoring/query-knowledgebases/projects/{project_name}/:import?api-version=2025-05-15-preview:
