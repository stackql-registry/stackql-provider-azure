      - name: assetKind
        in: query
        required: false
        schema:
          type: string
        description: 'Kind of the asset of the project. Known values are: "qnas" and "synonyms". Default value is
          None.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/QuestionAnsweringProject'
                  description: Parameters needed to create the project.
                assets:
                  $ref: '#/components/schemas/Assets'
                  description: All assets for this project.
                fileUri:
                  type: string
                  description: Import data File URI.
      responses:
        '204':
          description: Success (no content / accepted)
      x-stackql-resource: import_assets
      x-stackql-method: import_assets
      x-stackql-verb: EXEC
  /authoring/query-knowledgebases/projects/{project_name}/deployments/{deployment_name}?api-version=2025-05-15-preview:
    put:
      operationId: _QuestionAnsweringAuthoringClient_begin_deploy_project
      description: Deploy project to production.
      parameters:
      - name: project_name
        in: path
        required: true
        schema:
          type: string
