      type: object
      description: Data Lake Store account information. Variables are only populated by the server, and will be
        ignored when sending a request.
      properties:
        id:
          type: string
          description: The resource identifier.
        name:
          type: string
          description: The resource name.
        type:
          type: string
          description: The resource type.
        properties:
          type: object
          properties:
            suffix:
              type: string
              description: The optional suffix for the Data Lake Store account.
    StorageAccountInformation:
      type: object
      description: Azure Storage account information. Variables are only populated by the server, and will be ignored
        when sending a request.
      properties:
        id:
          type: string
          description: The resource identifier.
        name:
          type: string
          description: The resource name.
        type:
          type: string
          description: The resource type.
        properties:
          type: object
          properties:
            suffix:
              type: string
              description: The optional suffix for the storage account.
    ComputePolicy:
      type: object
      description: Data Lake Analytics compute policy information. Variables are only populated by the server, and
