            hostSuffix:
              type: string
              description: DNS suffix for public endpoints running in the Azure Dev Spaces Controller.
            dataPlaneFqdn:
              type: string
              description: DNS name for accessing DataPlane services.
            targetContainerHostApiServerFqdn:
              type: string
              description: DNS of the target container host's API server.
            targetContainerHostResourceId:
              type: string
              description: Resource ID of the target container host. Required.
            targetContainerHostCredentialsBase64:
              type: string
              description: Credentials of the target container host (base64). Required.
      required:
      - sku
      - properties
    ResourceProviderOperationDisplay:
      type: object
      description: ResourceProviderOperationDisplay.
      properties:
        provider:
          type: string
          description: Name of the resource provider.
        resource:
          type: string
          description: Name of the resource type.
        operation:
          type: string
          description: Name of the resource provider operation.
        description:
          type: string
          description: Description of the resource provider operation.
    ResourceProviderOperationDefinition:
      type: object
      description: ResourceProviderOperationDefinition.
      properties:
        name:
          type: string
          description: Resource provider operation name.
        display:
          $ref: '#/components/schemas/ResourceProviderOperationDisplay'
          description: ':vartype display: ~azure.mgmt.devspaces.models.ResourceProviderOperationDisplay'
