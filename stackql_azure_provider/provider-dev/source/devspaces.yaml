            "Canceled", "Updating", "Creating", "Deleting", and "Deleted".'
        hostSuffix:
          type: string
          description: DNS suffix for public endpoints running in the Azure Dev Spaces Controller.
        dataPlaneFqdn:
          type: string
          description: DNS name for accessing DataPlane services.
        targetContainerHostApiServerFqdn:
          type: string
          description: DNS of the target container host's API server.
        targetContainerHostResourceId:
          type: string
          description: Resource ID of the target container host. Required.
        targetContainerHostCredentialsBase64:
          type: string
          description: Credentials of the target container host (base64). Required.
