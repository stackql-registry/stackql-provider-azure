          description: Base class for types that supply values used to connect to container orchestrators.
    OrchestratorSpecificConnectionDetails:
      type: object
      description: 'Base class for types that supply values used to connect to container orchestrators. You probably
        want to use the sub-classes and not this class directly. Known sub-classes are: KubernetesConnectionDetails
        Variables are only populated by the server, and will be ignored when sending a request. All required parameters
        must be populated in order to send to Azure.'
